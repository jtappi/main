name: CI

# CI runs on pull_request only — not on push to main.
# Rationale: this is a solo-contributor repo. Tests run on the PR before merge,
# which is sufficient. Running again post-merge on every push to main adds CI
# minutes with no safety benefit when there is only one contributor.
#
# TODO (docs/TODO.md): Re-enable push trigger when a second contributor joins.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 0: Detect changed paths ───────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      portal:        ${{ steps.filter.outputs.portal }}
      trackmyweek:   ${{ steps.filter.outputs.trackmyweek }}
      bptracker:     ${{ steps.filter.outputs.bptracker }}
      prisondonkey:  ${{ steps.filter.outputs.prisondonkey }}
      ci:            ${{ steps.filter.outputs.ci }}
      scripts:       ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            portal:
              - 'portal/**'
              - 'core/**'
            trackmyweek:
              - 'trackmyweek/**'
            bptracker:
              - 'bptracker/**'
            prisondonkey:
              - 'prisondonkey/**'
            ci:
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'

  # ── Job 1: Unit & Integration Tests + Coverage ─────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() && (
        needs.changes.outputs.portal        == 'true' ||
        needs.changes.outputs.trackmyweek   == 'true' ||
        needs.changes.outputs.bptracker     == 'true' ||
        needs.changes.outputs.prisondonkey  == 'true' ||
        needs.changes.outputs.ci            == 'true' ||
        needs.changes.outputs.scripts       == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json
            trackmyweek/package-lock.json
            bptracker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Install trackmyweek dependencies
        run: npm ci
        working-directory: trackmyweek

      - name: Install bptracker dependencies
        run: npm ci
        working-directory: bptracker

      - name: Install prisondonkey dependencies
        run: npm install
        working-directory: prisondonkey

      - name: Bootstrap data files
        run: cp core/data/users.template.json core/data/users.json

      - name: Bootstrap trackmyweek data files
        run: |
          [ -f trackmyweek/data/data.json ]       || cp trackmyweek/data/data.template.json trackmyweek/data/data.json
          [ -f trackmyweek/data/categories.json ] || cp trackmyweek/data/categories.template.json trackmyweek/data/categories.json
          [ -f trackmyweek/data/reports.json ]    || cp trackmyweek/data/reports.template.json trackmyweek/data/reports.json
          [ -f trackmyweek/data/questions.json ]  || cp trackmyweek/data/questions.template.json trackmyweek/data/questions.json

      - name: Bootstrap bptracker data files
        run: |
          [ -f bptracker/data/readings.json ] || cp bptracker/data/readings.template.json bptracker/data/readings.json
          mkdir -p bptracker/data/images

      - name: Ensure log file exists
        run: touch logs/test-runs.jsonl

      - name: Run portal unit & integration tests with coverage
        run: npm run test:coverage -- --ci --forceExit --json --outputFile=/tmp/portal-jest-results.json
        working-directory: portal

      - name: Run trackmyweek unit tests with coverage
        run: npm run test:coverage -- --ci --forceExit --json --outputFile=/tmp/trackmyweek-jest-results.json
        working-directory: trackmyweek

      - name: Run bptracker unit & integration tests
        run: npm test -- --ci --forceExit --json --outputFile=/tmp/bptracker-jest-results.json
        working-directory: bptracker

      - name: Upload portal coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-portal
          path: portal/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload trackmyweek coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trackmyweek
          path: trackmyweek/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write coverage summary to job summary
        if: always()
        run: |
          echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Portal" >> $GITHUB_STEP_SUMMARY
          if [ -f portal/coverage/coverage-summary.json ]; then
            node -e "const s = require('./portal/coverage/coverage-summary.json').total; console.log('| Metric | Coverage |'); console.log('|--------|----------|'); console.log('| Statements | ' + s.statements.pct + '% |'); console.log('| Branches | ' + s.branches.pct + '% |'); console.log('| Functions | ' + s.functions.pct + '% |'); console.log('| Lines | ' + s.lines.pct + '% |');" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### TrackMyWeek" >> $GITHUB_STEP_SUMMARY
          if [ -f trackmyweek/coverage/coverage-summary.json ]; then
            node -e "const s = require('./trackmyweek/coverage/coverage-summary.json').total; console.log('| Metric | Coverage |'); console.log('|--------|----------|'); console.log('| Statements | ' + s.statements.pct + '% |'); console.log('| Branches | ' + s.branches.pct + '% |'); console.log('| Functions | ' + s.functions.pct + '% |'); console.log('| Lines | ' + s.lines.pct + '% |');" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/post-coverage-comment.js << 'SCRIPT'
          const fs    = require('fs');
          const https = require('https');

          function readSummary(p) {
            if (!fs.existsSync(p)) return null;
            return JSON.parse(fs.readFileSync(p, 'utf8')).total;
          }

          function table(s) {
            if (!s) return '_Report not generated._';
            return [
              '| Metric | Coverage |',
              '|--------|----------|',
              '| Statements | ' + s.statements.pct + '% |',
              '| Branches   | ' + s.branches.pct   + '% |',
              '| Functions  | ' + s.functions.pct  + '% |',
              '| Lines      | ' + s.lines.pct      + '% |',
            ].join('\n');
          }

          const portal = readSummary('portal/coverage/coverage-summary.json');
          const tmw    = readSummary('trackmyweek/coverage/coverage-summary.json');

          const body = [
            '<!-- coverage-comment -->',
            '## \ud83d\udcca Code Coverage',
            '',
            '### Portal',
            table(portal),
            '',
            '### TrackMyWeek',
            table(tmw),
            '',
            'Full HTML reports: **coverage-portal** and **coverage-trackmyweek** CI artifacts (14-day retention).',
          ].join('\n');

          const payload = JSON.stringify({ body });
          const [owner, repoName] = process.env.REPO.split('/');
          const prNumber = process.env.PR_NUMBER;

          const getOpts = {
            hostname: 'api.github.com',
            path: '/repos/' + owner + '/' + repoName + '/issues/' + prNumber + '/comments',
            method: 'GET',
            headers: {
              Authorization: 'Bearer ' + process.env.GH_TOKEN,
              'User-Agent': 'ci-coverage-bot',
              Accept: 'application/vnd.github+json',
            },
          };

          https.get(getOpts, res => {
            let data = '';
            res.on('data', c => { data += c; });
            res.on('end', () => {
              const comments = JSON.parse(data);
              const existing = comments.find(c => c.body && c.body.startsWith('<!-- coverage-comment -->'));
              const method = existing ? 'PATCH' : 'POST';
              const path = existing
                ? '/repos/' + owner + '/' + repoName + '/issues/comments/' + existing.id
                : '/repos/' + owner + '/' + repoName + '/issues/' + prNumber + '/comments';
              const postOpts = {
                hostname: 'api.github.com',
                path,
                method,
                headers: {
                  Authorization: 'Bearer ' + process.env.GH_TOKEN,
                  'User-Agent': 'ci-coverage-bot',
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload),
                },
              };
              const req = https.request(postOpts, r => {
                r.resume();
                r.on('end', () => console.log('Coverage comment posted (' + method + ' ' + r.statusCode + ')'));
              });
              req.on('error', e => { console.error(e); process.exit(1); });
              req.write(payload);
              req.end();
            });
          }).on('error', e => { console.error(e); process.exit(1); });
          SCRIPT
          node /tmp/post-coverage-comment.js

      - name: Log portal test run results
        if: always()
        run: node scripts/log-test-run.js /tmp/portal-jest-results.json --project=portal

      - name: Log trackmyweek test run results
        if: always()
        run: node scripts/log-test-run.js /tmp/trackmyweek-jest-results.json --project=trackmyweek

      - name: Log bptracker test run results
        if: always()
        run: node scripts/log-test-run.js /tmp/bptracker-jest-results.json --project=bptracker

      - name: Commit and push test log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp logs/test-runs.jsonl /tmp/test-runs-jest.jsonl
          git checkout -- logs/test-runs.jsonl
          git fetch origin main
          git checkout main
          git pull origin main
          cp /tmp/test-runs-jest.jsonl logs/test-runs.jsonl
          git add logs/test-runs.jsonl
          git diff --staged --quiet || git commit -m "chore: log test run results [skip ci]"
          git push origin HEAD:main

  # ── Job 2: E2E Tests (Playwright) ────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, test]
    # Only run when portal, trackmyweek, or CI config files changed.
    # bptracker and prisondonkey are intentionally excluded — they share no
    # runtime code with the portal auth flow or trackmyweek UI, so Playwright
    # adds no value there.
    if: |
      always() && needs.test.result != 'skipped' && (
        needs.changes.outputs.portal      == 'true' ||
        needs.changes.outputs.trackmyweek == 'true' ||
        needs.changes.outputs.ci          == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json
            trackmyweek/package-lock.json
            trackmyweek/client/package-lock.json
            bptracker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Install trackmyweek dependencies
        run: npm ci
        working-directory: trackmyweek

      - name: Install trackmyweek client dependencies
        run: npm ci
        working-directory: trackmyweek/client

      - name: Install bptracker dependencies
        run: npm ci
        working-directory: bptracker

      - name: Install prisondonkey dependencies
        run: npm install
        working-directory: prisondonkey

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Bootstrap data files
        run: cp core/data/users.template.json core/data/users.json

      - name: Bootstrap trackmyweek data files
        run: |
          [ -f trackmyweek/data/data.json ]       || cp trackmyweek/data/data.template.json trackmyweek/data/data.json
          [ -f trackmyweek/data/categories.json ] || cp trackmyweek/data/categories.template.json trackmyweek/data/categories.json
          [ -f trackmyweek/data/reports.json ]    || cp trackmyweek/data/reports.template.json trackmyweek/data/reports.json
          [ -f trackmyweek/data/questions.json ]  || cp trackmyweek/data/questions.template.json trackmyweek/data/questions.json

      - name: Bootstrap bptracker data files
        run: |
          [ -f bptracker/data/readings.json ] || cp bptracker/data/readings.template.json bptracker/data/readings.json
          mkdir -p bptracker/data/images

      - name: Build trackmyweek client
        run: npm run build
        working-directory: trackmyweek/client

      - name: Start portal server
        run: |
          SESSION_SECRET=ci-e2e-secret NODE_ENV=production node portal/server.js &
          echo $! > /tmp/portal.pid

      - name: Wait for portal to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null 2>&1; then
              echo "Portal ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Portal did not start in 30s" && exit 1

      - name: Run portal E2E tests
        id: portal-e2e
        run: |
          npx playwright test
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run trackmyweek E2E tests
        id: tmw-e2e
        run: |
          npx playwright test --config=trackmyweek/client/playwright.ci.config.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Stop portal server
        if: always()
        run: |
          if [ -f /tmp/portal.pid ]; then
            kill $(cat /tmp/portal.pid) || true
          fi

      - name: Log portal E2E results
        if: always()
        run: node scripts/log-test-run.js /tmp/portal-e2e-results.json --project=portal --type=e2e

      - name: Log trackmyweek E2E results
        if: always()
        run: node scripts/log-test-run.js /tmp/trackmyweek-e2e-results.json --project=trackmyweek --type=e2e

      - name: Commit and push E2E log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp logs/test-runs.jsonl /tmp/test-runs-e2e.jsonl
          git checkout -- logs/test-runs.jsonl
          git fetch origin main
          git checkout main
          git pull origin main
          cp /tmp/test-runs-e2e.jsonl logs/test-runs.jsonl
          git add logs/test-runs.jsonl
          git diff --staged --quiet || git commit -m "chore: log E2E test run results [skip ci]"
          git push origin HEAD:main

      - name: Upload portal Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-portal
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload trackmyweek Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-trackmyweek
          path: trackmyweek/client/playwright-report-tmw/
          retention-days: 7
          if-no-files-found: ignore

      - name: Set report slug
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SLUG="PR-${{ github.event.pull_request.number }}"
          else
            SLUG="push-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "REPORT_SLUG=${SLUG}" >> $GITHUB_ENV

      - name: Deploy Playwright reports to server
        if: always()
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $(echo "$DEPLOY_HOST" | cut -d@ -f2) >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_HOST" \
            "mkdir -p ~/apps/main/playwright-reports/${REPORT_SLUG}/portal ~/apps/main/playwright-reports/${REPORT_SLUG}/trackmyweek"

          if [ -d playwright-report ]; then
            rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
              playwright-report/ "$DEPLOY_HOST:~/apps/main/playwright-reports/${REPORT_SLUG}/portal/"
          else
            echo "No portal report directory found, skipping rsync"
          fi

          if [ -d trackmyweek/client/playwright-report-tmw ]; then
            rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
              trackmyweek/client/playwright-report-tmw/ "$DEPLOY_HOST:~/apps/main/playwright-reports/${REPORT_SLUG}/trackmyweek/"
          else
            echo "No trackmyweek report directory found, skipping rsync"
          fi

      - name: Post PR comment with report links
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- playwright-report-comment -->
            ## 🎥 Playwright Report — ${{ env.REPORT_SLUG }}

            | Suite | Status | Report |
            |-------|--------|--------|
            | Portal | ${{ steps.portal-e2e.outputs.exit_code == '0' && '✅ Passed' || '❌ Failed' }} | [View →](https://trackmyweek.com/playwright-reports/${{ env.REPORT_SLUG }}/portal/) |
            | TrackMyWeek | ${{ steps.tmw-e2e.outputs.exit_code == '0' && '✅ Passed' || '❌ Failed' }} | [View →](https://trackmyweek.com/playwright-reports/${{ env.REPORT_SLUG }}/trackmyweek/) |
          comment-author: github-actions[bot]
          body-includes: playwright-report-comment

      - name: Fail if any E2E tests failed
        if: always()
        run: |
          PORTAL_EXIT="${{ steps.portal-e2e.outputs.exit_code }}"
          TMW_EXIT="${{ steps.tmw-e2e.outputs.exit_code }}"
          if [ "$PORTAL_EXIT" != "0" ] || [ "$TMW_EXIT" != "0" ]; then
            echo "E2E tests failed - portal exit: ${PORTAL_EXIT:-n/a}  trackmyweek exit: ${TMW_EXIT:-n/a}"
            exit 1
          fi
          echo "All E2E tests passed"
