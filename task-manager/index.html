<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Tasks — 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="hdr">
      <h1>My Tasks — 2026</h1>
      <div class="hdr-right">
        <div class="view-switch" role="tablist" aria-label="Choose view">
          <button id="view-v1-btn" class="view-btn active" onclick="setView('v1')">V1</button>
          <button id="view-v2-btn" class="view-btn" onclick="setView('v2')">V2</button>
        </div>
        <span class="sv" id="sv"></span>
      </div>
    </div>

    <div id="view-v1">

    <div class="add-wrap">
      <input type="text" id="ni" placeholder="What needs to be done?" autocomplete="off" />
      <div class="add-row">
        <div class="pills">
          <button class="pill pw active" id="p-working" onclick="selCat('working')">Working on</button>
          <button class="pill pa" id="p-asap" onclick="selCat('asap')">Do ASAP</button>
          <button class="pill pl" id="p-later" onclick="selCat('later')">Do Later</button>
        </div>
        <button class="add-btn" onclick="addTask()">Add</button>
      </div>
    </div>

    <div class="cols">
      <div class="col">
        <div class="col-hd">
          <span class="col-lbl lw">Working on</span>
          <span class="col-n" id="cw">0</span>
        </div>
        <div id="lw"></div>
      </div>
      <div class="col">
        <div class="col-hd">
          <span class="col-lbl la">Do ASAP</span>
          <span class="col-n" id="ca">0</span>
        </div>
        <div id="la"></div>
      </div>
      <div class="col">
        <div class="col-hd">
          <span class="col-lbl ll">Do Later</span>
          <span class="col-n" id="cl">0</span>
        </div>
        <div id="ll"></div>
      </div>
    </div>

    <div class="foot">
      <button class="secbtn" id="tgl-closed" onclick="toggleClosed()">Show closed tasks (0)</button>
      <button class="clrbtn" onclick="clearDone()">Clear completed</button>
    </div>

    <div class="closed-wrap hide" id="closed-wrap">
      <div class="closed-hd">
        <span>Closed Task Audit Trail</span>
      </div>
      <div id="closed-list"></div>
    </div>

    </div>

    <div id="view-v2" class="hide">
      <div class="v2-add-wrap">
        <input type="text" id="ni2" placeholder="Capture task..." autocomplete="off" />
        <div class="v2-add-row">
          <select id="cat2" class="v2-select">
            <option value="working">Working on</option>
            <option value="asap">Do ASAP</option>
            <option value="later">Do Later</option>
          </select>
          <input type="date" id="date2" class="v2-select" />
          <button class="add-btn" onclick="addTaskFromV2()">Add Task</button>
        </div>
      </div>

      <div class="v2-stats">
        <div class="v2-stat"><span>Total</span><strong id="v2-total">0</strong></div>
        <div class="v2-stat"><span>Open</span><strong id="v2-open">0</strong></div>
        <div class="v2-stat" id="v2-overdue-stat"><span>Overdue</span><strong id="v2-overdue">0</strong></div>
        <div class="v2-stat"><span>Closed</span><strong id="v2-done">0</strong></div>
      </div>

      <section class="v2-timeline-wrap">
        <div class="v2-timeline-top">
          <div class="v2-section-hd">Timeline</div>
          <div class="v2-timeline-switch" role="tablist" aria-label="Timeline view mode">
            <button id="timeline-list-btn" class="timeline-btn active" onclick="setTimelineMode('list')">List</button>
            <button id="timeline-swimlane-btn" class="timeline-btn" onclick="setTimelineMode('swimlane')">Calendar Mon-Fri</button>
          </div>
        </div>
        <div class="v2-week-row" id="v2-week-row">
          <div class="v2-week-label" id="v2-week-label"></div>
          <div class="v2-week-nav">
            <button class="timeline-btn" onclick="shiftSwimlaneWeek(-1)">Previous Week</button>
            <button class="timeline-btn" onclick="jumpToCurrentSwimlaneWeek()">This Week</button>
            <button class="timeline-btn" onclick="shiftSwimlaneWeek(1)">Next Week</button>
          </div>
        </div>
        <div class="v2-timeline" id="v2-timeline"></div>
      </section>

      <section class="v2-focus-wrap hide" id="v2-focus-wrap">
        <div class="v2-focus-head">
          <div>
            <div class="v2-section-hd">Timeline Focus</div>
            <div class="v2-focus-title" id="v2-focus-title"></div>
          </div>
          <button class="timeline-btn" onclick="closeTimelinePanel()">Close</button>
        </div>
        <div class="v2-focus-meta" id="v2-focus-meta"></div>
        <div class="v2-focus-grid">
          <label>Owner<input id="focus-owner" placeholder="Name" /></label>
          <label>Due date<input id="focus-due" type="date" /></label>
          <label class="full">Tags (comma separated)<input id="focus-tags" placeholder="risk, rollout" /></label>
          <label class="full">Notes<textarea id="focus-notes" rows="4" placeholder="context, blockers, dependencies"></textarea></label>
        </div>
        <div class="v2-focus-actions">
          <button class="mvbtn" id="focus-save" onclick="saveTimelinePanelDetails()">Save</button>
        </div>
      </section>

      <div class="v2-board-toggle-row">
        <button class="timeline-btn" id="v2-board-toggle" onclick="toggleV2Board()">Show Board</button>
      </div>

      <div class="v2-board" id="v2-list"></div>

      <div class="foot">
        <button class="secbtn" id="tgl-closed-2" onclick="toggleClosed()">Show closed tasks (0)</button>
        <button class="clrbtn" onclick="clearDone()">Clear completed</button>
      </div>

      <div class="closed-wrap hide" id="closed-wrap-2">
        <div class="closed-hd">
          <span>Closed Task Audit Trail</span>
        </div>
        <div id="closed-list-2"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
